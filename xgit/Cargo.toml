[package]
name = "xgit"
version = "2604.17.1"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
log = "0.4"
env_logger = "0.10"
regex = "1"
which = "4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
ratatui = "0.28"
crossterm = "0.28"
chrono = { version = "0.4", features = ["clock"] }

[dev-dependencies]
tempfile = "3"
