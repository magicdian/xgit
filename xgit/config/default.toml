[ui]
lang = "zh-CN"

[features]
push = true
annotate = true

[annotate.staged]
include_untracked = false

[annotate.form]
fields = ["reason", "reference_kind", "reference_value"]

[annotate]
reference_kinds = ["bug", "req"]

[annotate.date]
format = "yyyy-mm-dd"

[annotate.render]
align_with_code_indent = false
wrap_blank_lines = true

[annotate.old_code.line_comment]
layout = "per_line"
header = "old:"
body_prefix = "old: "
body_suffix = ""

[annotate.old_code.block_comment]
title = "cover old codes"
body_prefix = ""

[annotate.block_templates.add]
start = "// {author_tag} {date} add: {reason} ({reference_kind}:{reference_value})"
end = "// end add"

[annotate.block_templates.modify]
start = "// {author_tag} {date} modify: {reason} ({reference_kind}:{reference_value}) old={old}"
end = "// end modify"

[annotate.block_templates.del]
start = "// {author_tag} {date} del: {reason} ({reference_kind}:{reference_value}) old={old}"
end = "// end del"

[[annotate.file_rules]]
pattern = "*.c"
renderer = "c_line_block"

[[annotate.file_rules]]
pattern = "*.h"
renderer = "c_line_block"

[[annotate.file_rules]]
pattern = "*.cpp"
renderer = "c_line_block"

[[annotate.file_rules]]
pattern = "*.java"
renderer = "c_line_block"
