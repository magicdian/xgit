name: xgit-ci

on:
  push:
    paths:
      - "xgit/**"
      - ".github/workflows/xgit-ci.yml"
  pull_request:
    paths:
      - "xgit/**"
      - ".github/workflows/xgit-ci.yml"

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: xgit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked
